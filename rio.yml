schemaVersion: 2.0
timeout: 120

pipelines:
  # Pipeline to build Flink from Apple branch.
  - name: publish-release-1.15-acs
    branchName: release-1.15-acs
    machine:
      baseImage: docker.apple.com/thomas-weise/flink-ci:latest
    build:
      template: freestyle:v4:publish
      steps:
        - cd /workspace
        - rm -rf .staged-artifacts
        - mvn clean deploy -Dscala-2.12 -Phive-3.1.3.0-apple,s3-plugin,docs-and-source -DskipTests -Dfast -DaltDeploymentRepository=local-staging::default::file://`pwd`/.staged-artifacts
        # see https://docs.aci.apple.com/rio/guide-to-rio/package-and-publish/freeform.html
        # must exclude maven-metadata.xml
        - ci stage-lib --exclude maven-metadata.xml --exclude *.md5 --exclude *.sha1 --many-many-artifacts ./.staged-artifacts/**
        # Prepare for docker image build
        - cd flink-dist/target/flink-*-bin/; tar cvzf flink.tgz flink-*; cp flink.tgz /workspace/apple/docker/; ls -la /workspace/apple/docker/
        - cd /workspace/apple/docker; wget https://archive.apache.org/dist/hadoop/common/hadoop-3.3.1/hadoop-3.3.1.tar.gz; cd /workspace
    package:
      # enable for release (non -SNAPSHOT) builds
      # release: true
      freeform:
        - publish:
            - repo: m2:oss-patched
      dockerfile:
        - dockerfilePath: apple/docker/Dockerfile.base
          context: apple/docker/
          perApplication: false
          version: "0-r${RIO_BUILD_NUMBER}"
          extraTags: [ "latest", "0-latest" ]
          publish:
            - repo: docker.apple.com/acs-flink/flink-1.15-acs
        - dockerfilePath: apple/docker/Dockerfile.hadoop
          context: apple/docker/
          perApplication: false
          version: "0-r${RIO_BUILD_NUMBER}"
          extraTags: [ "latest", "0-latest" ]
          publish:
            - repo: docker.apple.com/acs-flink/flink-1.15-acs-hadoop

  - name: pull-request-release-1.15-acs
    branchName: release-1.15-acs
    timeout: 600
    machine:
      baseImage: docker.apple.com/thomas-weise/flink-ci:latest
    build:
      template: freestyle:v4:prb
      steps:
        - cd /workspace
        - rm -rf .staged-artifacts
        - mvn clean package -Phive-3.1.3.0-apple,s3-plugin -Dscala-2.12 -Dmaven.test.failure.ignore=true
